# Fast-moving developer tools. These are deliberately outside Nix so their
# release cadence is not coupled to the Home Manager flake.
#
# Run `mise install` after applying Home Manager. Project-local mise.toml files
# can override these versions when a repository needs something different.

[tools]
node = "26.13.1"
bun = "1.4.4"
deno = "2.9.8"
claude = "latest"
# The bundled aqua recipe currently misidentifies DuckDB's release assets.
# Select the CLI archive explicitly; DuckDB names these linux-amd64,
# linux-arm64, osx-amd64, and osx-arm64.
[tools."github:duckdb/duckdb"]
version = "2.0.0"
asset_pattern = 'duckdb-cli-{{ os(macos="osx") }}-{{ arch(x64="amd64", arm64="arm64") }}.tar.gz'
