    - resource: Script
      id: InstallPowerShellFzfIntegration
      directives:
        description: Install PSReadLine + PSFzf for better interactive PowerShell
      settings:
        GetScript: |
          @{ Result = "Modules checked in TestScript." }
        TestScript: |
          $psrl = Get-Module -ListAvailable PSReadLine | Select-Object -First 1
          $psfzf = Get-Module -ListAvailable PSFzf | Select-Object -First 1
          return [bool]($psrl -and $psfzf)
        SetScript: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Host
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted | Out-Host

          Install-Module PSReadLine -Scope CurrentUser -Force | Out-Host
          Install-Module PSFzf     -Scope CurrentUser -Force | Out-Host

      #
      # --- VS Code + extensions ---
      #
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: VSCode
      settings:
        Id: Microsoft.VisualStudioCode
        Source: winget
        Ensure: Present

    - resource: Script
      id: VSCodeExtensions
      dependsOn:
        - VSCode
      settings:
        GetScript: |
          @{ Result = "Extension state checked in TestScript" }
        TestScript: |
          $code = (Get-Command code -ErrorAction SilentlyContinue)?.Source
          if (-not $code) { return $false }
          $exts = & $code --list-extensions 2>$null
          $needed = @(
            "ms-vscode-remote.remote-wsl",
            "ms-python.python",
            "esbenp.prettier-vscode",
            "vscodevim.vim"
          )
          return (($needed | Where-Object { $exts -notcontains $_ }).Count -eq 0)
        SetScript: |
          $ErrorActionPreference = "Stop"
          $code = (Get-Command code -ErrorAction SilentlyContinue)?.Source
          if (-not $code) { throw "VS Code CLI (code) not found on PATH yet. Open VS Code once or restart your shell, then re-run winget configure." }

          $needed = @(
            "ms-vscode-remote.remote-wsl",
            "ms-python.python",
            "esbenp.prettier-vscode",
            "vscodevim.vim"
          )

          $exts = & $code --list-extensions 2>$null
          foreach ($e in $needed) {
            if ($exts -notcontains $e) {
              & $code --install-extension $e --force
            }
          }

